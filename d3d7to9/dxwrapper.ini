;; DXWrapper / D3D7to9 — global prefix config (prefix-wide, not per-game)
;; Loaded from the same dir as ddraw.dll (syswow64).
[General]
; The "real" ddraw D3D7to9 forwards 2D calls to. MUST NOT be the D3D7to9 dll
; itself (that would recurse). Points at Wine's builtin ddraw (copied aside as
; ddraw_wine.dll) so D3D7 is translated to D3D9 (DXVK) while 2D still works.
RealDllPath                = C:\windows\syswow64\ddraw_wine.dll
WrapperMode                = AUTO
DisableLogging             = 0

[Compatibility]
Dd7to9                     = 1
D3d8to9                    = 0
D3d9to9Ex                  = 0
D3d9on12                   = 0
DDrawCompat                = 0
Dinputto8                  = 0
DisableGameUX              = 0
EnableDdrawWrapper         = 0
EnableD3d9Wrapper          = 0
EnableDinput8Wrapper        = 0
EnableDsoundWrapper        = 0
DisableGDIGammaRamp        = 0

[ddraw]
DdrawUseDirect3D9Caps      = 0
